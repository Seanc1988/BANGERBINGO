<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Banger Bingo · Phone Cards</title><link rel="stylesheet" href="phone.css"></head><body><header class="github-phone-head"><img src="banger-logo.png" alt="Banger Bingo"><div><small>BANGER BINGO</small><h1>PHONE PLAY</h1></div></header><main class="github-phone-main"><div id="connectStatus" class="connect-status">Enter the game code shown by the host.</div><section id="codeJoin"><h2>Enter Game Code</h2><input id="codeInput" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit game code"><input id="codeName" maxlength="80" placeholder="Your name"><button id="codeJoinButton">JOIN GAME</button><p><a id="triviaLink" href="trivia.html">Playing Trivia instead?</a></p></section><div id="notice" role="status"></div><div id="view"></div><section id="join" hidden><h2>Join this game</h2><input id="name" placeholder="Your name" maxlength="80"><button id="joinButton">Get my card</button></section><section id="card" hidden></section><button id="reconnect" class="reconnect-control" hidden>Reconnect</button></main><script src="peerjs.min.js"></script><script src="rtc-config.js"></script><script src="phone-controller.js"></script></body></html>
